<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="坚果墙">
  <defs>
    <radialGradient id="wnBody" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#D4A56A"/>
      <stop offset="40%" stop-color="#B8834A"/>
      <stop offset="100%" stop-color="#7A4F2F"/>
    </radialGradient>
    <radialGradient id="wnShade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#4A2A10" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="wnHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE8C0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="wnShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a0e05" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#wnShadow)">
    <!-- Main body -->
    <ellipse cx="70" cy="72" rx="52" ry="58" fill="url(#wnBody)" stroke="#4A2A10" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Texture lines - wood grain -->
    <g stroke="#8A5A30" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none">
      <path d="M30 50 C40 55, 50 48, 60 52"/>
      <path d="M80 48 C90 45, 100 50, 110 48"/>
      <path d="M28 72 C38 68, 48 75, 55 70"/>
      <path d="M85 70 C92 74, 100 68, 112 72"/>
      <path d="M35 92 C45 88, 55 94, 62 90"/>
      <path d="M78 90 C88 94, 98 88, 105 92"/>
    </g>

    <!-- Center crease -->
    <path d="M70 20 C68 40, 72 60, 70 80 C68 95, 72 110, 70 125" fill="none" stroke="#6A3A18" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Shadow overlay -->
    <ellipse cx="70" cy="72" rx="52" ry="58" fill="url(#wnShade)" stroke="none"/>

    <!-- Highlight overlay -->
    <ellipse cx="62" cy="50" rx="30" ry="22" fill="url(#wnHighlight)" stroke="none"/>

    <!-- Small cracks for character -->
    <g stroke="#5A3018" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M24 60 L30 65 L26 72"/>
      <path d="M116 55 L110 60 L114 68"/>
    </g>

    <!-- Eyes - worried expression -->
    <ellipse cx="52" cy="62" rx="12" ry="14" fill="#FFFDF5" stroke="#4A2A10" stroke-width="2.5"/>
    <ellipse cx="88" cy="62" rx="12" ry="14" fill="#FFFDF5" stroke="#4A2A10" stroke-width="2.5"/>
    <ellipse cx="54" cy="64" rx="6" ry="8" fill="#2A1608"/>
    <ellipse cx="90" cy="64" rx="6" ry="8" fill="#2A1608"/>
    <!-- Eye highlights -->
    <circle cx="56" cy="60" r="3" fill="#FFF" opacity="0.85"/>
    <circle cx="92" cy="60" r="3" fill="#FFF" opacity="0.85"/>
    <circle cx="52" cy="68" r="1.5" fill="#FFF" opacity="0.4"/>
    <circle cx="88" cy="68" r="1.5" fill="#FFF" opacity="0.4"/>

    <!-- Worried eyebrows - angled inward -->
    <path d="M38 46 C44 40, 56 39, 64 44" fill="none" stroke="#4A2A10" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M76 44 C84 39, 96 40, 102 46" fill="none" stroke="#4A2A10" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Worried mouth - wavy frown -->
    <path d="M48 88 C54 84, 60 90, 66 86 C70 84, 74 84, 78 86 C82 88, 88 84, 92 88" fill="none" stroke="#4A2A10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Teeth visible behind frown -->
    <path d="M56 86 L60 86 L60 90 L56 90Z" fill="#FFF8E0" stroke="#4A2A10" stroke-width="1" opacity="0.7"/>
    <path d="M80 86 L84 86 L84 90 L80 90Z" fill="#FFF8E0" stroke="#4A2A10" stroke-width="1" opacity="0.7"/>

    <!-- Stress sweat drop -->
    <path d="M108 48 C110 42, 114 42, 114 48 C114 54, 110 56, 108 54 C106 52, 106 50, 108 48Z" fill="#88CCFF" stroke="#4488BB" stroke-width="1.2" opacity="0.7"/>
  </g>
</svg>
