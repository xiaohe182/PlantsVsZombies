<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" role="img" aria-label="向日葵">
  <defs>
    <radialGradient id="sfFace" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B5E3C"/>
      <stop offset="70%" stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#3E2510"/>
    </radialGradient>
    <radialGradient id="sfPetal" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFD233"/>
      <stop offset="100%" stop-color="#D4960A"/>
    </radialGradient>
    <linearGradient id="sfStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FAF3A"/>
      <stop offset="100%" stop-color="#2E6B1A"/>
    </linearGradient>
    <linearGradient id="sfLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6DBF47"/>
      <stop offset="100%" stop-color="#3A7D22"/>
    </linearGradient>
    <radialGradient id="sfCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E9E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF9E9E" stop-opacity="0"/>
    </radialGradient>
    <filter id="sfShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a0e05" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Stem -->
  <path d="M70 95 C68 110, 66 125, 64 148 Q63 155, 70 156 Q77 155, 76 148 C74 125, 72 110, 70 95Z" fill="url(#sfStem)" stroke="#1E4A0E" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left leaf -->
  <path d="M66 118 C50 108, 32 112, 22 122 C34 126, 52 122, 66 118Z" fill="url(#sfLeaf)" stroke="#1E4A0E" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right leaf -->
  <path d="M74 130 C90 120, 108 124, 118 134 C106 138, 88 134, 74 130Z" fill="url(#sfLeaf)" stroke="#1E4A0E" stroke-width="2" stroke-linejoin="round"/>

  <!-- Petal ring (12 petals) -->
  <g filter="url(#sfShadow)">
    <g stroke="#B8860B" stroke-width="1.8" stroke-linejoin="round">
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(0,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(30,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(60,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(90,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(120,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(150,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(180,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(210,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(240,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(270,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(300,70,58)"/>
      <ellipse cx="70" cy="16" rx="11" ry="24" fill="url(#sfPetal)" transform="rotate(330,70,58)"/>
    </g>
  </g>

  <!-- Face center -->
  <circle cx="70" cy="58" r="28" fill="url(#sfFace)" stroke="#2A1608" stroke-width="2.8"/>

  <!-- Eyes -->
  <ellipse cx="59" cy="52" rx="8" ry="10" fill="#FFFDF5" stroke="#2A1608" stroke-width="1.8"/>
  <ellipse cx="81" cy="52" rx="8" ry="10" fill="#FFFDF5" stroke="#2A1608" stroke-width="1.8"/>
  <ellipse cx="60" cy="53" rx="4" ry="5.5" fill="#1A0E05"/>
  <ellipse cx="82" cy="53" rx="4" ry="5.5" fill="#1A0E05"/>
  <!-- Eye highlights -->
  <circle cx="62" cy="50" r="2.2" fill="#FFF" opacity="0.9"/>
  <circle cx="84" cy="50" r="2.2" fill="#FFF" opacity="0.9"/>
  <circle cx="58" cy="55" r="1.2" fill="#FFF" opacity="0.5"/>
  <circle cx="80" cy="55" r="1.2" fill="#FFF" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M50 42 C54 38, 63 38, 67 41" fill="none" stroke="#2A1608" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M73 41 C77 38, 86 38, 90 42" fill="none" stroke="#2A1608" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="70" cy="60" rx="2.5" ry="2" fill="#3E2510" opacity="0.5"/>

  <!-- Cheeks -->
  <circle cx="50" cy="62" r="7" fill="url(#sfCheek)"/>
  <circle cx="90" cy="62" r="7" fill="url(#sfCheek)"/>

  <!-- Mouth - happy smile -->
  <path d="M58 68 Q63 76, 70 76 Q77 76, 82 68" fill="#4A2010" stroke="#2A1608" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M62 68 Q66 72, 70 72 Q74 72, 78 68" fill="#E85050" stroke="none"/>

  <!-- Face highlight -->
  <ellipse cx="62" cy="44" rx="10" ry="6" fill="#FFF" opacity="0.08"/>
</svg>
