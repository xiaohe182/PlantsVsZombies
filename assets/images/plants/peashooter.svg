<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="豌豆射手">
  <defs>
    <radialGradient id="psHead" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#A8E86C"/>
      <stop offset="45%" stop-color="#6BBF3E"/>
      <stop offset="100%" stop-color="#3A7D20"/>
    </radialGradient>
    <radialGradient id="psTube" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8BD44E"/>
      <stop offset="100%" stop-color="#4A8E28"/>
    </radialGradient>
    <linearGradient id="psStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FAF3A"/>
      <stop offset="100%" stop-color="#2E6B1A"/>
    </linearGradient>
    <linearGradient id="psLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6DBF47"/>
      <stop offset="100%" stop-color="#3A7D22"/>
    </linearGradient>
    <radialGradient id="psMouth" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1A3A08"/>
      <stop offset="100%" stop-color="#0D1F04"/>
    </radialGradient>
    <filter id="psShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a1a05" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Stem -->
  <path d="M65 100 C63 115, 60 130, 58 150 Q57 158, 64 158 Q71 158, 70 150 C68 130, 66 115, 65 100Z" fill="url(#psStem)" stroke="#1E4A0E" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left leaf -->
  <path d="M62 120 C44 110, 28 114, 18 126 C30 130, 48 126, 62 120Z" fill="url(#psLeaf)" stroke="#1E4A0E" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right leaf -->
  <path d="M68 132 C86 122, 102 126, 112 138 C100 142, 82 138, 68 132Z" fill="url(#psLeaf)" stroke="#1E4A0E" stroke-width="2" stroke-linejoin="round"/>
  <!-- Small leaf near head -->
  <path d="M58 98 C46 88, 36 90, 30 98 C38 102, 50 100, 58 98Z" fill="url(#psLeaf)" stroke="#1E4A0E" stroke-width="1.8" stroke-linejoin="round"/>

  <g filter="url(#psShadow)">
    <!-- Head - main sphere -->
    <ellipse cx="65" cy="58" rx="35" ry="33" fill="url(#psHead)" stroke="#1E4A0E" stroke-width="3" stroke-linejoin="round"/>

    <!-- Tube/cannon - upper lip -->
    <path d="M88 40 C100 36, 120 36, 138 40 C142 42, 144 48, 142 52 C140 54, 130 56, 120 54 L100 54 C94 54, 90 50, 88 46Z" fill="url(#psTube)" stroke="#1E4A0E" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- Tube - lower lip -->
    <path d="M88 54 C92 56, 100 58, 108 58 L128 58 C134 58, 140 56, 142 52 C142 56, 138 62, 130 64 C120 66, 100 66, 90 62 C88 60, 86 58, 88 54Z" fill="url(#psTube)" stroke="#1E4A0E" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- Mouth interior -->
    <ellipse cx="130" cy="52" rx="10" ry="8" fill="url(#psMouth)" stroke="none"/>

    <!-- Upper head highlight ridge -->
    <path d="M38 42 C46 30, 62 24, 75 28" fill="none" stroke="#C5F5A0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Eyes -->
    <ellipse cx="50" cy="48" rx="10" ry="12" fill="#FFFDF5" stroke="#1E4A0E" stroke-width="2.2"/>
    <ellipse cx="74" cy="48" rx="10" ry="12" fill="#FFFDF5" stroke="#1E4A0E" stroke-width="2.2"/>
    <ellipse cx="52" cy="49" rx="5" ry="6.5" fill="#1A0E05"/>
    <ellipse cx="76" cy="49" rx="5" ry="6.5" fill="#1A0E05"/>
    <!-- Eye highlights -->
    <circle cx="54" cy="46" r="2.8" fill="#FFF" opacity="0.9"/>
    <circle cx="78" cy="46" r="2.8" fill="#FFF" opacity="0.9"/>
    <circle cx="50" cy="52" r="1.5" fill="#FFF" opacity="0.4"/>
    <circle cx="74" cy="52" r="1.5" fill="#FFF" opacity="0.4"/>

    <!-- Angry/determined eyebrows -->
    <path d="M38 34 C44 30, 56 29, 62 34" fill="none" stroke="#1E4A0E" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 34 C72 29, 84 30, 90 34" fill="none" stroke="#1E4A0E" stroke-width="3" stroke-linecap="round"/>

    <!-- Vein/detail lines on head -->
    <path d="M42 62 C50 60, 56 62, 60 66" fill="none" stroke="#3A7D20" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M72 64 C78 60, 84 62, 88 66" fill="none" stroke="#3A7D20" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Chin/jaw line -->
    <path d="M40 72 C50 82, 68 84, 80 76" fill="none" stroke="#1E4A0E" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Head top bumps -->
    <circle cx="50" cy="28" r="5" fill="#6BBF3E" stroke="#1E4A0E" stroke-width="1.8"/>
    <circle cx="65" cy="25" r="5" fill="#6BBF3E" stroke="#1E4A0E" stroke-width="1.8"/>
    <circle cx="78" cy="28" r="5" fill="#6BBF3E" stroke="#1E4A0E" stroke-width="1.8"/>
  </g>

  <!-- Head highlight -->
  <ellipse cx="56" cy="38" rx="14" ry="8" fill="#FFF" opacity="0.06"/>
</svg>
