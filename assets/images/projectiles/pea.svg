<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="豌豆">
  <defs>
    <radialGradient id="peaFill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#E0FFB0"/>
      <stop offset="30%" stop-color="#A8E860"/>
      <stop offset="70%" stop-color="#6BBF3E"/>
      <stop offset="100%" stop-color="#3A7D20"/>
    </radialGradient>
    <radialGradient id="peaShine" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="19" cy="20" rx="13" ry="12" fill="#2A5A12" opacity="0.3"/>

  <!-- Main pea -->
  <circle cx="18" cy="18" r="14" fill="url(#peaFill)" stroke="#2A5A12" stroke-width="2.2"/>

  <!-- Shine -->
  <circle cx="18" cy="18" r="14" fill="url(#peaShine)" stroke="none"/>

  <!-- Specular highlight -->
  <ellipse cx="13" cy="12" rx="5" ry="4" fill="#FFF" opacity="0.6" transform="rotate(-15,13,12)"/>

  <!-- Small secondary highlight -->
  <circle cx="24" cy="22" r="2" fill="#FFF" opacity="0.25"/>
</svg>
