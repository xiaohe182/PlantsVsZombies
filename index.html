<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物大战僵尸 - 骨架版</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div id="app">
    <section id="game-shell">
      <aside id="plant-sidebar" class="side-panel">
        <section id="card-panel" aria-label="植物卡槽"></section>
      </aside>

      <main id="game-main">
        <section id="game-board" aria-label="游戏棋盘">
          <div id="board-stage">
            <div class="board-frame">
              <div id="board-hud">
                <div class="hud-pill">
                  <img class="hud-icon" src="./assets/images/ui/sun.svg" alt="阳光">
                  <strong id="sun-count">150</strong>
                </div>
                <div class="hud-pill">
                  <span class="hud-label">波次</span>
                  <strong id="wave-count">0 / 3</strong>
                </div>
              </div>
              <div class="board-glow"></div>
              <div id="grid-layer"></div>
              <div id="entity-layer"></div>
            </div>
          </div>
        </section>
      </main>

      <aside id="control-panel" class="side-panel">
        <div id="action-panel" class="panel-stack">
          <button id="start-button" class="icon-button" type="button" aria-label="开始">▶</button>
          <button id="pause-button" class="icon-button" type="button" aria-label="暂停">Ⅱ</button>
          <button id="restart-button" class="icon-button" type="button" aria-label="重开">↻</button>
        </div>
      </aside>
    </section>

    <div id="drag-layer"></div>

    <section id="modal-layer" class="is-hidden" aria-live="polite">
      <div id="result-modal" class="modal-card">
        <h2 id="modal-title">游戏结果</h2>
        <p id="modal-text">等待结果。</p>
        <button id="modal-restart-button" type="button">重新开始</button>
      </div>
    </section>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/grid.js"></script>
  <script src="./js/plants.js"></script>
  <script src="./js/zombies.js"></script>
  <script src="./js/projectiles.js"></script>
  <script src="./js/sun.js"></script>
  <script src="./js/level.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/events.js"></script>
  <script src="./js/game-loop.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
